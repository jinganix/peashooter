name: RELEASE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (x.y.z). Required when republishing only.'
        required: false
      publish_only:
        description: 'Republish only (tag must already exist)'
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0
          ref: master

      - name: Validate version
        id: validate-version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PUBLISH_ONLY: ${{ github.event.inputs.publish_only }}
        run: |
          current_version=$(grep -m1 'version =' gradle.properties | grep -oE '([0-9]+\.[0-9]+\.[0-9]+)')
          input_version="${INPUT_VERSION}"
          publish_only="${PUBLISH_ONLY}"
          echo "Current version: ${current_version}, Input version: ${input_version}, Publish only: ${publish_only}"
          if [[ "${publish_only}" == "true" ]]; then
            if ! [[ "${input_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: publish_only requires a valid version number (x.y.z)"
              exit 1
            fi
            release_version=${input_version}
          elif [[ -n "${input_version}" ]]; then
            if ! [[ "${input_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid version number ${input_version}. Please use format x.y.z"
              exit 1
            fi
            IFS='.' read -ra p1 <<< "${input_version}"
            IFS='.' read -ra p2 <<< "${current_version}"
            if [ "${p1[0]}" -lt "${p2[0]}" ] \
              || [[ "${p1[0]}" -eq "${p2[0]}" && "${p1[1]}" -lt "${p2[1]}" ]] \
              || [[ "${p1[0]}" -eq "${p2[0]}" && "${p1[1]}" -eq "${p2[1]}" && "${p1[2]}" -lt "${p2[2]}" ]]; then
              echo "ERROR: Input version is less than the current version"
              exit 1
            fi
            release_version=${input_version}
          else
            release_version=${current_version}
          fi
          echo "release_version=${release_version}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"

      - name: Check tag existence
        shell: bash
        env:
          PUBLISH_ONLY: ${{ github.event.inputs.publish_only }}
        run: |
          if [[ "${PUBLISH_ONLY}" == "true" ]]; then
            if [ -z "$(git tag -l "v${release_version}")" ]; then
              echo "ERROR: Tag v${release_version} does not exist"
              exit 1
            fi
          elif [ -n "$(git tag -l "v${release_version}")" ]; then
            echo "ERROR: Tag v${release_version} already exists"
            exit 1
          fi

      - name: Write version to file
        run: |
          echo "${release_version}" >> /tmp/release_version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: /tmp/release_version
          retention-days: 30

  update-release:
    name: Update release version
    needs: [prepare]
    if: github.event.inputs.publish_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}
          path: /tmp

      - name: Read release version
        run: |
          release_version=$(cat /tmp/release_version)
          echo "release_version=${release_version}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Commit release version
        shell: bash
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          if [[ $(grep -m1 'version =' gradle.properties) == *-SNAPSHOT ]]; then
            sed -i "s/version = .*/version = ${release_version}/" gradle.properties
            node scripts/sync-versions.mjs --all
            git add gradle.properties README.md README.zh.md
            git commit -m "chore: release ${release_version}" --quiet
          fi

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          commit-message: 'chore: release ${{ env.release_version }}'
          title: 'chore: release ${{ env.release_version }}'
          base: 'master'
          branch: 'release-${{ env.release_version }}'

      - name: Auto merge pull request
        continue-on-error: true
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          pr_number="${PR_NUMBER}"
          echo "Pull Request number: ${pr_number}"
          if [ -z "$pr_number" ]; then
            echo "Error: pull Request number is empty or does not exist"
            exit 1
          fi
          gh pr merge "${pr_number}" --squash --admin

  bump-snapshot:
    name: Bump snapshot version
    needs: [update-release]
    if: github.event.inputs.publish_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}
          path: /tmp

      - name: Read release version
        run: |
          release_version=$(cat /tmp/release_version)
          echo "release_version=${release_version}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0
          ref: master

      - name: Find release commit
        run: |
          release_commit=$(git log --grep="chore: release ${release_version}" -n 10 --pretty=format:%H)
          echo "Release commit: ${release_commit}"
          if [ -z "$release_commit" ]; then
            echo "Error: release_commit is empty or does not exist"
            exit 1
          fi
          echo "release_commit=${release_commit}" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump snapshot version
        shell: bash
        run: |
          IFS='.' read -ra parts <<< "${release_version}"
          major=${parts[0]}
          minor=${parts[1]}
          patch=${parts[2]}
          patch=$((patch + 1))
          snapshot_version=$major.$minor.$patch
          echo "snapshot_version=${snapshot_version}" >> "${GITHUB_ENV}"
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          sed -i "s/version = .*/version = ${snapshot_version}-SNAPSHOT/" gradle.properties
          node scripts/sync-versions.mjs --consumer-version "${release_version}"
          git add gradle.properties README.md README.zh.md
          git commit -m "chore: bump version to ${snapshot_version}-SNAPSHOT"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          commit-message: 'chore: bump version to ${{ env.snapshot_version }}-SNAPSHOT'
          title: 'chore: bump version to ${{ env.snapshot_version }}-SNAPSHOT'
          base: 'master'
          branch: 'bump-${{ env.snapshot_version }}'

      - name: Auto merge pull request
        continue-on-error: true
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "${PR_NUMBER}" --squash --admin

  release:
    name: Release
    needs: [update-release]
    if: github.event.inputs.publish_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}
          path: /tmp

      - name: Read release version
        run: |
          release_version=$(cat /tmp/release_version)
          echo "release_version=${release_version}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0
          ref: master

      - name: Find release commit
        run: |
          release_commit=$(git log --grep="chore: release ${release_version}" -n 10 --pretty=format:%H)
          if [ -z "$release_commit" ]; then
            echo "Error: release_commit is empty or does not exist"
            exit 1
          fi
          echo "release_commit=${release_commit}" >> "${GITHUB_ENV}"

      - name: Create release tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.ACTION_TOKEN }}
          custom_tag: v${{ env.release_version }}
          commit_sha: ${{ env.release_commit }}

      - name: Create github release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  publish:
    name: Publish
    needs: [prepare, release]
    if: always() && needs.prepare.result == 'success' && (github.event.inputs.publish_only == 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download release_version
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}
          path: /tmp

      - name: Read release version
        run: |
          release_version=$(cat /tmp/release_version)
          echo "release_version=${release_version}" >> "${GITHUB_ENV}"
          echo "Release version: ${release_version}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          ref: refs/tags/v${{ env.release_version }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Build and publish
        run: ./gradlew publish -Dorg.gradle.parallel=false --info
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.NEXUS_REPO_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.NEXUS_REPO_PASSWORD }}
