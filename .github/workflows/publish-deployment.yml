name: PUBLISH_DEPLOYMENT

on:
  workflow_dispatch:
    inputs:
      deploymentId:
        description: 'Central Portal deployment id to publish'
        required: true

jobs:
  publish:
    name: Publish deployment
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment to Maven Central
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deploymentId }}
          NEXUS_REPO_USERNAME: ${{ secrets.NEXUS_REPO_USERNAME }}
          NEXUS_REPO_PASSWORD: ${{ secrets.NEXUS_REPO_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOYMENT_ID}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "ERROR: invalid deploymentId"
            exit 1
          fi
          umask 077
          netrc_file="$(mktemp)"
          trap 'rm -f "${netrc_file}"' EXIT
          {
            echo "machine central.sonatype.com"
            echo "login ${NEXUS_REPO_USERNAME}"
            echo "password ${NEXUS_REPO_PASSWORD}"
          } > "${netrc_file}"
          code=$(curl -s -o /tmp/publish_response.txt -w "%{http_code}" \
            --netrc-file "${netrc_file}" \
            -X POST "https://central.sonatype.com/api/v1/publisher/deployment/${DEPLOYMENT_ID}")
          echo "HTTP status: ${code}"
          cat /tmp/publish_response.txt
          if [ "${code}" != "204" ]; then
            echo "ERROR: expected HTTP 204"
            exit 1
          fi
