name: CI

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 10 * * *' # Once per day at 10am UTC
  workflow_dispatch:

jobs:
  commit-msg:
    name: Check Commit Message
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check-skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          validate_one() {
            git log -1 --pretty=format:%B "$1" > /tmp/commit-msg.txt
            echo "--- $1: $(head -1 /tmp/commit-msg.txt)"
            ./scripts/validate-commit-msg.sh /tmp/commit-msg.txt
          }
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            validate_one HEAD
          else
            for sha in $(git rev-list "$BEFORE..$HEAD_SHA"); do
              validate_one "$sha"
            done
          fi

      - name: Skip when release
        id: check-skip
        shell: bash
        env:
          COMMIT_FILTER: "^chore: (bump version|release)"
        run: |
          last_commit_log=$(git log -1 --pretty=format:"%s")
          readonly last_commit_log
          echo "Last commit log: $last_commit_log"

          filter_count=$(echo "$last_commit_log" | grep -c -E "$COMMIT_FILTER" || true)
          readonly filter_count

          if [[ "$filter_count" -gt 0 ]]; then
            echo "The last commit log \"$last_commit_log\" contains \"$COMMIT_FILTER\", stopping"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build
    needs: [commit-msg]
    if: ${{ needs.commit-msg.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup redis on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --name redis -p 6379:6379 -d redis:7.4.0-alpine
          until docker exec redis redis-cli ping | grep -q PONG; do sleep 1; done

      - name: Setup redis on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install redis
          brew services start redis
          until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      # Linux runs the aggregated coverage report in the same Gradle invocation as `build`,
      # so tests execute once. macOS stays a plain build.
      - name: Build with Gradle (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          redis-host: redis://127.0.0.1:6379
          skip_benchmark: true
        run: ./gradlew clean build coverageReport --info

      - name: Build with Gradle (macOS)
        if: matrix.os == 'macos-latest'
        env:
          redis-host: redis://127.0.0.1:6379
          skip_benchmark: true
        run: ./gradlew clean build --info

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: aggregation/build/reports/jacoco/coverage/coverage.xml
          if-no-files-found: error

  codecov:
    name: Upload coverage to Codecov
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: false

  publish:
    name: Publish
    needs: [commit-msg, build]
    if: always() && needs.commit-msg.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.NEXUS_REPO_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.NEXUS_REPO_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip release version
        run: |
          current_version=$(grep -m1 'version =' gradle.properties | grep -oE '([0-9]+\.[0-9]+\.[0-9]+.*)')
          echo "Current version: ${current_version}"
          echo "current_version=${current_version}" >> "${GITHUB_ENV}"

      - name: Setup JDK
        if: "${{ endsWith(env.current_version, '-SNAPSHOT') }}"
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Publish to Nexus
        if: "${{ endsWith(env.current_version, '-SNAPSHOT') }}"
        run: ./gradlew publish -Dorg.gradle.parallel=false --info
