name: PR

on:
  merge_group:
  pull_request:
    branches:
      - master

jobs:
  commit-msg:
    name: Check Commit Message
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'pull_request' || (github.event.pull_request.title != '' && !startsWith(github.event.pull_request.title, 'chore: release') && !startsWith(github.event.pull_request.title, 'chore: bump version to')) }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.title }}" > /tmp/pr-title.txt
            ./scripts/validate-commit-msg.sh /tmp/pr-title.txt
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            RANGE="${{ github.event.merge_group.base_sha }}..HEAD"
          fi
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --pretty=format:%B "$sha" > /tmp/commit-msg.txt
            echo "--- $sha: $(head -1 /tmp/commit-msg.txt)"
            ./scripts/validate-commit-msg.sh /tmp/commit-msg.txt
          done

  build:
    name: Build
    needs: [commit-msg]
    if: always() && (needs.commit-msg.result == 'success' || needs.commit-msg.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Setup redis on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --name redis -p 6379:6379 -d redis:7.4.0-alpine
          until docker exec redis redis-cli ping | grep -q PONG; do sleep 1; done

      - name: Setup redis on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install redis
          brew services start redis
          until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build with Gradle
        env:
          redis-host: redis://127.0.0.1:6379
          skip_benchmark: true
        run: ./gradlew clean build --info
